# .pre-commit-config.yaml
default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
exclude: "(reports|logs|.devcontainer)/.*"
repos:
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint
        args: [--strict]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer

      - id: trailing-whitespace

      - id: check-yaml
        args: [-m, --unsafe]

      - id: check-json

      - id: check-toml

      - id: check-merge-conflict

      # Python Specific
      - id: check-ast

      - id: check-docstring-first

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]

      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.4.0.dev1
    hooks:
      - id: pyrefly-check
        name: pyrefly
        stages:
          - pre-commit
          - pre-push
        language: system  # Use system-installed pyrefly
        files: .*(\.py|\.pyi)$
        # Recommended to do full repo checks.
        # However, you can change this to `true` to only check changed files
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        stages:
          - pre-commit
          - pre-push
        language: system
        entry: uv run pytest
        files: (src|tests)/.*(\.py|\.pyi)$
        args:
          - tests
          - -q
          - --no-summary
          - --no-header
        # Recommended to do full repo checks.
        # However, you can change this to `true` to only check changed files
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.18
    hooks:
      # Ensure the lockfile is up-to-date
      - id: uv-lock
        args: [-U]

      # Synchronize your dependencies upon branch checkout, pull or rebase:
      - id: uv-sync
        stages:
          - post-checkout
          - post-merge
          - post-rewrite
        # Needed for any post stages
        always_run: true
