### BUILD SYSTEM ###
# NOTE: See https://peps.python.org/pep-0621/
[build-system]
requires = ["setuptools>=60", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "bitstructures"
description = "Bit Structures"
authors = [{ name = "WibblyGhost" }]
# Files
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Indexing
keywords = ["bit", "bits", "struct", "structure", "encoder", "decoder"]
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 5 - Production/Stable",

    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Networking",
    "Topic :: Utilities",

    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Requirements
requires-python = ">=3.13"
dependencies = ["bitarray>=3.8.0"]

[project.urls]
# Homepage = "https://example.com"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/WibblyGhost/BitStructures.git"
Issues = "https://github.com/WibblyGhost/BitStructures/issues"
# Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "faker>=33.3.1",
    "pre-commit>=4.0.0",
    "pyrefly>=1.3.1",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.4",
    "ruff>=0.9.1",
    "scapy>=2.6.1",
]
build = ["setuptools>=60", "setuptools-git-versioning>=2.1.0"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}"
dirty_template = "{tag}"

[tool.setuptools.dynamic]
readme = { file = "README.md" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*tests*"]

[tool.setuptools.package-data]
bitstructures = ["py.typed"]
### BUILD SYSTEM ###


[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle
    "W",     # pycodestyle
    "D",     # pydocstyle
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "R",     # refactor
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "LOG",   # flake8-logging
    "PT",    # felake8-pytest-style
    "Q",     # flake8-quotes
    "RET",   #  flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "FIX",   # flake8-fixme
    "PL",    # pylint
    "RUF",   # ruff
]
fixable = ["ALL"]
ignore = [
    "D203",     # Incorrect black line before class
    "D100",     # Docstring in public module
    "D105",     # Docstring in magic method
    "D212",     # Multiline Docstring Start
    "D205",     # Line between summary and description
    "D401",     # Docstring imperative mood
    "D107",     # Docstring in __init__  # We use the public class docstrings
    "PLR0915",  # too many statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positionals
    "PLR2004",  # magic values
    "RUF012",   # classvar annotations
    "SIM108",   # ternary oprators (single line if statements)
    "ASYNC109", # Use asyncio timeout instead
    "FIX002",   # TODO statements
    "PLR0917",  # Too many positional arguments
]
isort.split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104"]
"tests/*.py" = ["SLF001", "PT013"]
"typing.py" = ["D101", "D107", "D102", "D100"]
"exceptions.py" = ["D101", "D107"]
"test_*.py" = ["D100", "D101", "D102"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pyrefly]
project-excludes = ["**/*tests/"]
preset = "strict"
ignore-missing-imports = ["rpyc.*"]
check-unannotated-defs = true
infer-return-types = "never"
infer-with-first-use = false
strict-callable-subtyping = true

[tool.pyrefly.errors]
abstract-method-call = "error"
explicit-any = "warn"
missing-override-decorator = "error"
no-any-return = "error"
redundant-cast = "error"
redundant-condition = "error"
unannotated-return = "error"
unused-call-result = "error"
unused-coroutine = "error"
unused-ignore = "error"
unused-type-ignore = "error"

[tool.pytest.ini_options]
addopts = "--cov --cov-report=xml --cov-report=term  --cov-report=html"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
omit = ["*/__init__.py", "*/tests/*"]
