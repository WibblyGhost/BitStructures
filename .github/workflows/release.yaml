name: Publish

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"

      - name: Build Package
        run: uv build

      - name: Publish Package
        run: uv publish
