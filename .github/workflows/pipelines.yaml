name: CI Code Pipelines

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"

      - name: Sync Dependencies
        run: uv sync

      - name: Pre-Commit
        env:
          SKIP: "pytest,uv-lock"
        run: uv run pre-commit run --all-files

  type-check:
    name: Pyrefly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"

      - name: Sync Dependencies
        run: uv sync

      - name: Type Checking
        run: uv run pyrefly check

      - name: Type Coverage
        run: uv run pyrefly coverage check --fail-under=90

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"

      - name: Sync Dependencies
        run: uv sync

      - name: Run Tests
        run: |
          uv run pytest \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml
