name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"

      - name: Sync Dependencies
        run: uv sync

      - name: Pre-Commit
        env:
          SKIP: "pytest,uv-lock"
        run: uv run pre-commit run --all-files

  type-check:
    name: Pyrefly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"

      - name: Sync Dependencies
        run: uv sync

      - name: Type Checking
        run: uv run pyrefly check

      - name: Type Coverage
        run: uv run pyrefly coverage check --fail-under=90

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"

      - name: Sync Dependencies
        run: uv sync

      - name: Run Tests
        run: |
          uv run pytest \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml